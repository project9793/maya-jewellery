name: Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project folder
        id: locate
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f MayaJewellery.zip ]; then
            unzip -q MayaJewellery.zip -d _src
            echo "dir=_src/MayaJewellery" >> "$GITHUB_OUTPUT"
          else
            echo "settings.gradle.kts not found" && exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x gradlew || true
          if [ -x gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-jewellery-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
